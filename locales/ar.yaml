    rebuilt_restart_limit_exceeded: "ظل كل مزوّد في سلسلة البدائل يفشل وينتقل إلى التالي، لذا توقّف الدور بدلًا من إعادة المحاولة بلا نهاية. أرسل `continue` أو بدّل المزوّد."
    budget_exhausted: "نفدت ميزانية الدورات/التكلفة لهذا الدور قبل الوصول إلى إجابة نهائية. أرسل `continue` للمتابعة."
    ollama_runtime_context_too_small: "نافذة سياق النموذج المحلي كانت أصغر من أن يكتمل الرد. زِد حجم السياق أو استخدم نموذجًا أكبر."
    pending_tool_result: "توقّف الدور بينما كانت نتيجة أداة لا تزال معلّقة ولم يكتب النموذج أي نص بعدها. أرسل `continue` ليقدّم ملخصًا."
    interrupted_during_api_call: "انقطع الطلب أثناء الاستدعاء قبل وصول الرد. أرسل `continue` لإعادة المحاولة."
    max_iterations_reached: "تم بلوغ الحد الأقصى لدورات الأدوات قبل الوصول إلى إجابة نهائية. أرسل `continue` للمتابعة، أو ارفع `max_iterations`."
    error_near_max_iterations: "حدث خطأ قرب حد الدورات قبل الوصول إلى إجابة نهائية. راجع مخرجات الأداة أعلاه، ثم أرسل `continue`."
    repeated_outer_errors: "ظل الدور يفشل بأخطاء متكررة فتم إيقافه مبكرًا بدلًا من إعادة المحاولة بلا نهاية. راجع الأخطاء أعلاه، ثم أرسل `continue` لإعادة المحاولة."
  persistence:
    compression: "توقّف الدور لأن عملية أخرى كانت تضغط هذه الجلسة. من المفترض أن رسالتك محفوظة بالفعل — أرسلها مرة أخرى بعد اكتمال الضغط."
    compression_closed: "توقّف الدور لأن ضغط السياق بدّل هذه الجلسة وتعذّر اعتماد استمرارها المباشر. التخزين نفسه سليم — حدّث العميل (أو ابدأ دورًا جديدًا) ليلتقط معرّف الجلسة الجديد، ثم أرسل رسالتك مرة أخرى."
    turn_lease: "توقّف الدور لأن عملية Hermes أخرى تولّت هذه الجلسة. لم يُحفظ ردك — انتظر حتى تنتهي العملية الأخرى، ثم أرسل رسالتك مرة أخرى."
    session_row_missing: "حُذفت هذه الجلسة من التخزين بينما كانت المحادثة لا تزال مفتوحة، وتعذّر على Hermes إعادة إنشائها، لذا لم تُحفظ هذه الرسالة. أرسل رسالتك مرة أخرى؛ وإذا استمر الفشل، شغّل `hermes {profile_arg}doctor`."
    locked: "توقّف الدور لأن تخزين الجلسات كان مشغولًا (عملية Hermes أخرى كانت تكتب في قاعدة بيانات الحالة). من المفترض أن رسالتك محفوظة بالفعل — أرسلها مرة أخرى بعد لحظات."
    replaced: "تم استبدال ملف قاعدة بيانات الجلسات أثناء تشغيل Hermes، لذا لم تُحفظ هذه الرسالة (توجد نسخة في {home}/sessions/). أوقف Hermes (`hermes {profile_arg}gateway stop`)، وشغّل `hermes {profile_arg}doctor` — وليس `hermes {profile_arg}doctor --fix`، لأنه سيصلح الملف الخطأ في مكانه — ثم شغّله من جديد وأرسل رسالتك مرة أخرى. خطوات الاستعادة المتقدمة موجودة في السجل."
    deleted_wal: "لا تزال عملية Hermes أخرى تحتفظ بنسخة قديمة من سجل الكتابة المسبقة (write-ahead log) لقاعدة بيانات الجلسات، لذا أوقف Hermes الكتابة حفاظًا على سلامة الملف ولم تُحفظ هذه الرسالة (توجد نسخة في {home}/sessions/). لم يُفقد شيء. أغلق كل عمليات Hermes على ملف التعريف هذا (تطبيق سطح المكتب، `hermes {profile_arg}gateway stop`، لوحة التحكم، cron)، وشغّل `hermes {profile_arg}doctor` — سيحدّد أي عملية لا تزال تحتفظ بالسجل — ثم شغّل Hermes من جديد وأرسل رسالتك مرة أخرى. لا تشغّل `doctor --fix` ولا تحذف أي ملفات state.db أثناء عملها. الدليل: {recovery_docs}"
    corrupt: "توقّف الدور لأن قاعدة بيانات الحالة أبلغت عن تلف هيكلي (كان سجل المحادثة سيضيع عند إعادة التشغيل). تحرير مساحة على القرص لن يفيد. خيارات الاستعادة:\n1. شغّل `hermes {profile_arg}doctor --fix`\n2. أوقف البوابة، ثم استعِد باستخدام:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (إذا أفاد بإمكانية الاستعادة) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — الاستعادة تأخذ لقطة من الملف التالف أولًا؛ لا تشغّل `sqlite3 ... \".recover\"` على state.db الحي، فقد يزيده إصدار sqlite3 CLI معيب تلفًا\n3. استعِد من نسخة احتياطية في {backups_dir}/\nثم أرسل رسالتك مرة أخرى."
    fts_index: "توقّف الدور لأن فهرس البحث في الجلسات (FTS5) تالف وتعذّر فصله، لذا لم تُحفظ هذه الرسالة. مخزن الرسائل نفسه غير تالف: لا تشغّل أدوات الاستعادة ولا تستعِد نسخة احتياطية. شغّل `hermes {profile_arg}doctor --fix` (أو أعد تشغيل Hermes، فهو يصلح الفهرس عند الفتح)، ثم أرسل رسالتك مرة أخرى."
    disk: "تعذّر على Hermes حفظ هذه المحادثة على القرص، فتوقّف بدلًا من أن يفقد رسائلك. على الأرجح القرص ممتلئ: حرّر بعض المساحة (أو أصلح الصلاحيات على {home}/state.db)، ثم أرسل رسالتك مرة أخرى."
    default: "تعذّر على Hermes حفظ هذه المحادثة، فتوقّف بدلًا من أن يفقد رسائلك. الأسباب المحتملة: نفاد المساحة على القرص، أو أن عملية Hermes أخرى تحتجز قاعدة البيانات. أغلق نوافذ Hermes الأخرى، وشغّل `hermes {profile_arg}doctor` لفحص التخزين، ثم أرسل رسالتك مرة أخرى."
  file_mutation:
    header: "⚠️ مدقّق تعديل الملفات: فشل {count} تعديل على الملفات في هذا الدور، بغض النظر عن أي صياغة أعلاه قد توحي بغير ذلك. شغّل `git status` أو `read_file` للتأكد مما طُبّق فعلًا."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "فشل"
  shared:
    and_more: "  • … و{count} أخرى"
    the_model: "النموذج"

tips:
  # CLI startup / /new discovery tips (hermes_cli/tips.py). Zero-padded index keeps YAML
  # order stable; pickers read tips.tNNN for the active language.
  t001: "/bg <prompt> يشغّل مهمة في جلسة منفصلة وتبقى جلستك الحالية متاحة؛ و/btw <question> يجيب عن سؤال جانبي حول هذه المحادثة دون مقاطعتها."
  t002: "/branch يتفرّع من الجلسة الحالية لتجرّب اتجاهًا مختلفًا دون أن تفقد تقدّمك."
  t003: "/compress يضغط سياق المحادثة يدويًا عندما تطول."
  t004: "/rollback يعرض نقاط حفظ نظام الملفات — استعِد الملفات التي عدّلها الوكيل إلى أي حالة سابقة."
  t005: "/rollback diff 2 يعرض ما تغيّر منذ نقطة الحفظ 2 دون استعادة أي شيء."
  t006: "/rollback 2 src/file.py يستعيد ملفًا واحدًا من نقطة حفظ محددة."
  t007: "/title \"my project\" يسمّي جلستك — وتقدر تكمّلها لاحقًا بـ /resume أو hermes -c."
  t008: "/resume يكمل من حيث توقفت في جلسة سمّيتها من قبل."
  t009: "/queue <prompt> يضع رسالة في الانتظار للدور التالي دون مقاطعة الدور الحالي."
  t010: "/undo يحذف آخر تبادل بين المستخدم والمساعد من المحادثة."
  t011: "/retry يعيد إرسال رسالتك الأخيرة — مفيد لما رد الوكيل ميكونش مظبوط."
  t012: "/verbose يبدّل عرض تقدّم الأدوات: off → new → all → verbose."
  t013: "/reasoning high يزيد عمق تفكير النموذج. و/reasoning show يعرض الاستدلال."
  t014: "/fast يفعّل/يعطّل المعالجة ذات الأولوية لاستجابات API أسرع (حسب المزوّد)."
  t015: "/yolo يتخطى كل طلبات الموافقة على الأوامر الخطرة لبقية الجلسة."
  t016: "/model يتيح لك تبديل النموذج في منتصف الجلسة — جرّب /model sonnet أو /model gpt-5."
  t017: "/model --global يغيّر نموذجك الافتراضي بشكل دائم."
  t018: "/personality pirate يضبط شخصية مرحة — 14 خيارًا مدمجًا من kawaii إلى shakespeare."
  t019: "/skin يغيّر مظهر CLI — جرّب moskinet أو ares أو mono أو slate أو poseidon أو charizard."
  t020: "/statusbar يُظهر/يُخفي شريطًا ثابتًا يعرض النموذج والتوكنات ونسبة امتلاء السياق والتكلفة والمدة."
  t021: "/tools disable browser يزيل أدوات المتصفح مؤقتًا للجلسة الحالية."
  t022: "/browser connect يربط أدوات المتصفح بمتصفحك العامل من عائلة Chromium عبر CDP."
  t023: "/plugins يعرض الإضافات المثبّتة وحالتها."
  t024: "/cron يدير المهام المجدولة — اضبط طلبات متكررة مع إرسالها إلى أي منصة."
  t025: "/reload-mcp يعيد تحميل إعدادات خادم MCP فورًا دون إعادة التشغيل."
  t026: "/usage يعرض استخدام التوكنات وتفصيل التكلفة ومدة الجلسة."
  t027: "/insights يعرض تحليلات الاستخدام لآخر 30 يومًا."
  t028: "/paste يفحص الحافظة بحثًا عن صورة ويرفقها برسالتك التالية."
  t029: "/profile يعرض ملف التعريف النشط ومجلده الرئيسي."
  t030: "/config يعرض إعداداتك الحالية في لمحة."
  t031: "/stop يوقف كل العمليات الخلفية التي شغّلها الوكيل."
  t032: "@file:path/to/file.py يُدرج محتوى الملف مباشرة في رسالتك."
  t033: "@file:main.py:10-50 يُدرج الأسطر 10-50 فقط من الملف."
  t034: "@folder:src/ يُدرج قائمة بشجرة المجلد."
  t035: "@diff يُدرج تغييرات git غير المجهّزة (unstaged) في الرسالة."
  t036: "@staged يُدرج تغييرات git المجهّزة (git diff --staged)."
  t037: "@git:5 يُدرج آخر 5 Commits مع التعديلات كاملة."
  t038: "@url:https://example.com يجلب محتوى صفحة ويب ويُدرجه."
  t039: "كتابة @ تفعّل الإكمال التلقائي لمسارات الملفات — تنقّل إلى أي ملف بشكل تفاعلي."
  t040: "اجمع عدة مراجع: \"Review @file:main.py and @file:test.py for consistency.\""
  t041: "Alt+Enter يضيف سطرًا جديدًا للإدخال متعدد الأسطر. (Windows Terminal يعترض Alt+Enter — استخدم Ctrl+Enter بدلًا منه.)"
  t042: "Ctrl+C يقاطع الوكيل. اضغطه مرتين خلال ثانيتين لفرض الخروج."
  t043: "Ctrl+Z يعلّق Hermes في الخلفية — شغّل fg في الصدفة للعودة."
  t044: "Tab يقبل النص المقترح تلقائيًا أو يكمل الأوامر المائلة."
  t045: "اكتب رسالة جديدة أثناء عمل الوكيل لمقاطعته وتوجيهه من جديد."
  t046: "Alt+V يلصق صورة من الحافظة في المحادثة."
  t047: "لصق 5 أسطر أو أكثر يحفظها تلقائيًا في ملف ويُدرج مرجعًا مختصرًا بدلًا منها."
  t048: "hermes -c يستأنف أحدث جلسة CLI لك. وhermes -c \"project name\" يستأنف بالعنوان."
  t049: "hermes -w ينشئ شجرة عمل (worktree) معزولة في git — مثالية لسير عمل وكلاء متوازٍ."
  t050: "hermes -w -q \"Fix issue #42\" يجمع بين عزل شجرة العمل واستعلام لمرة واحدة."
  t051: "hermes chat -t web,terminal يفعّل مجموعات أدوات محددة فقط لجلسة مركّزة."
  t052: "hermes chat -s github-pr-workflow يحمّل مهارة مسبقًا عند التشغيل."
  t053: "hermes chat -q \"query\" ينفّذ استعلامًا واحدًا غير تفاعلي ثم يخرج."
  t054: "hermes chat --max-turns 1000 يتجاوز الحد الافتراضي البالغ 500 دورة لكل دور."
  t055: "hermes chat --checkpoints يفعّل لقطات نظام الملفات قبل كل تغيير مدمّر على الملفات."
  t056: "hermes --yolo يتخطى كل طلبات الموافقة على الأوامر الخطرة طوال الجلسة."
  t057: "hermes chat --source telegram يوسم الجلسة لتصفيتها في hermes sessions list."
  t058: "hermes -p work chat يعمل تحت ملف تعريف محدد دون تغيير الافتراضي."
  t059: "hermes doctor --fix يشخّص مشاكل الإعدادات والاعتماديات ويصلحها تلقائيًا."
  t060: "hermes dump يُخرج ملخصًا مختصرًا للإعداد — ممتاز لتقارير الأخطاء."
  t061: "hermes config set KEY VALUE يوجّه الأسرار تلقائيًا إلى .env وكل ما عداها إلى config.yaml."
  t062: "hermes config edit يفتح config.yaml في محررك الافتراضي."
  t063: "hermes config check يفحص خيارات الإعداد الناقصة أو القديمة."
  t064: "hermes sessions browse يفتح أداة تفاعلية لاختيار الجلسات مع البحث."
  t065: "hermes sessions stats يعرض عدد الجلسات حسب المنصة وحجم قاعدة البيانات."
  t066: "hermes sessions prune --older-than 30 ينظّف الجلسات القديمة."
  t067: "hermes skills search react --source skills-sh يبحث في الدليل العام skills.sh."
  t068: "hermes skills check يفحص مهارات hub المثبّتة بحثًا عن تحديثات من المصدر."
  t069: "hermes skills tap add myorg/skills-repo يضيف مصدر مهارات مخصصًا من GitHub."
  t070: "hermes skills snapshot export setup.json يصدّر إعدادات مهاراتك للنسخ الاحتياطي أو المشاركة."
  t071: "hermes mcp add github --command npx يضيف خوادم MCP من سطر الأوامر."
  t072: "hermes mcp-serve يشغّل Hermes نفسه كخادم MCP لوكلاء آخرين."
  t073: "hermes auth add يتيح لك إضافة عدة مفاتيح API للتناوب ضمن مجموعة بيانات الاعتماد."
  t074: "hermes completion bash >> ~/.bashrc يفعّل الإكمال بـ Tab لكل الأوامر وملفات التعريف."
  t075: "hermes logs -f يتابع agent.log لحظيًا. و--level WARNING --since 1h يصفّي المخرجات."
  t076: "hermes backup ينشئ نسخة احتياطية zip من مجلد Hermes الرئيسي بالكامل."
  t077: "hermes profile create coder ينشئ ملف تعريف معزولًا يصبح أمرًا مستقلًا."
  t078: "hermes profile create work --clone ينسخ إعداداتك ومفاتيحك الحالية إلى ملف تعريف جديد."
  t079: "hermes update يزامن المهارات المضمّنة الجديدة مع كل ملفات التعريف تلقائيًا."
  t080: "hermes gateway install يثبّت Hermes كخدمة نظام (systemd/launchd)."
  t081: "hermes memory setup يتيح لك ضبط مزوّد ذاكرة خارجي (Honcho، Mem0، وغيرهما)."
  t082: "hermes webhook subscribe ينشئ مسارات Webhook قائمة على الأحداث مع تحقق HMAC."
  t083: "وفّر فلوسك: hermes tools يعطّل الأدوات غير المستخدمة، وhermes skills config يقلّل المهارات."
  t084: "/reasoning low أو /reasoning minimal يخفّض عمق التفكير تحت الافتراضي (medium) — ردود أسرع وأرخص."
  t085: "hermes models يوجّه مهام الرؤية والضغط والمهام المساعدة إلى نماذج أرخص — يخفّض تكلفة التوكنات في الخلفية بأكثر من 85% دون التنازل عن نموذج المحادثة الرئيسي."
  t086: "اضبط display.bell_on_complete: true في config.yaml لتسمع جرسًا عند انتهاء المهام الطويلة."
  t087: "اضبط display.streaming: true لترى التوكنات تظهر لحظيًا أثناء توليد النموذج."
  t088: "اضبط display.show_reasoning: true لتتابع سلسلة تفكير النموذج."
  t089: "اضبط display.compact: true لتقليل المسافات الفارغة في المخرجات وعرض معلومات أكثف."
  t090: "اضبط display.busy_input_mode: queue لوضع الرسائل في الانتظار بدلًا من مقاطعة الوكيل، أو steer لإدراجها أثناء التشغيل عبر /steer."
  t091: "اضبط display.resume_display: minimal لتخطي ملخص المحادثة الكامل عند استئناف الجلسة."
  t092: "اضبط compression.threshold: 0.50 للتحكم في توقيت الضغط التلقائي (الافتراضي: 50% من السياق)."
  t093: "اضبط agent.max_turns: 1000 ليأخذ الوكيل خطوات استدعاء أدوات أكثر في كل دور."
  t094: "اضبط file_read_max_chars: 200000 لزيادة الحد الأقصى للمحتوى في كل استدعاء read_file."
  t095: "اضبط approvals.mode: smart ليوافق نموذج LLM تلقائيًا على الأوامر الآمنة ويرفض الخطرة تلقائيًا."
  t096: "اضبط fallback_model في config.yaml للانتقال تلقائيًا إلى مزوّد احتياطي عند الفشل."
  t097: "اضبط privacy.redact_pii: true لتجزئة معرّفات المستخدمين وأرقام الهواتف قبل إرسالها إلى LLM."
  t098: "اضبط browser.headed: true لتشاهد نافذة Chromium المحلية أثناء تصفّح الوكيل."
  t099: "اضبط worktree: true في config.yaml لإنشاء شجرة عمل git دائمًا (مثل hermes -w)."
  t100: "اضبط security.website_blocklist.enabled: true لحظر نطاقات محددة من أدوات الويب."
  t101: "اضبط cron.wrap_response: false لإرسال مخرجات الوكيل الخام دون ترويسة/تذييل cron."
  t102: "HERMES_TIMEZONE يتجاوز المنطقة الزمنية للخادم بأي سلسلة منطقة زمنية IANA."
  t103: "استبدال متغيرات البيئة يعمل في config.yaml: استخدم صيغة ${VAR_NAME}."
  t104: "الأوامر السريعة في config.yaml تشغّل أوامر الصدفة فورًا دون استهلاك أي توكن."
  t105: "يمكن تعريف شخصيات مخصصة في config.yaml تحت agent.personalities."
  t106: "provider_routing يتحكم في ترتيب مزوّدي OpenRouter والقوائم البيضاء والسوداء."
  t107: "execute_code يشغّل سكربتات Python تستدعي أدوات Hermes برمجيًا — وتبقى النتائج خارج السياق."
  t108: "delegate_task يطلق حتى 10 وكلاء فرعيين متزامنين افتراضيًا (delegation.max_concurrent_children) بسياقات معزولة للعمل المتوازي."
  t109: "web_extract يعمل مع روابط PDF — مرّر أي رابط PDF وسيحوّله إلى markdown."
  t110: "search_files مبني على ripgrep وأسرع من grep — استخدمه بدلًا من grep في الطرفية."
  t111: "patch يستخدم 9 استراتيجيات مطابقة تقريبية حتى لا تُفسد فروقات المسافات البسيطة التعديلات."
  t112: "patch يدعم صيغة V4A لتعديلات جماعية على عدة ملفات في استدعاء واحد."
  t113: "read_file يقترح أسماء ملفات مشابهة عندما لا يجد الملف."
  t114: "read_file يزيل التكرار تلقائيًا — إعادة قراءة ملف لم يتغيّر تُرجع نسخة مختصرة خفيفة."
  t115: "اضبط browser.user_data_dir على مجلد للاحتفاظ بملف تعريف Chromium دائم، لتبقى تسجيلات الدخول للمواقع بين الجلسات."
  t116: "browser.chromium_args يضيف خيارات Chromium إضافية لجلسات المتصفح المحلية، مثل --lang=de."
  t117: "image_generate ينشئ صورًا باستخدام FLUX 2 Pro مع تكبير تلقائي 2x."
  t118: "text_to_speech يحوّل النص إلى صوت — يُشغَّل كفقاعات صوتية على Telegram."
  t119: "send_message يمكنه الوصول إلى أي منصة مراسلة متصلة من داخل الجلسة."
  t120: "أداة todo تساعد الوكيل على تتبّع المهام المعقدة متعددة الخطوات أثناء الجلسة."
  t121: "session_search يبحث بالنص الكامل في كل المحادثات السابقة."
  t122: "الوكيل يحفظ التفضيلات والتصحيحات ومعلومات البيئة في الذاكرة تلقائيًا."
  t123: "/moa يوجّه طلبًا صعبًا واحدًا عبر مجموعة نماذج Mixture of Agents التي ضبطتها."
  t124: "أوامر الطرفية تدعم وضع الخلفية مع notify_on_complete للمهام الطويلة."
  t125: "العمليات الخلفية في الطرفية تدعم watch_patterns للتنبيه عند ظهور أسطر محددة في المخرجات."
  t126: "أداة الطرفية تدعم 6 واجهات خلفية: local وDocker وSSH وModal وDaytona وSingularity."
  t127: "لكل ملف تعريف إعداداته ومفاتيح API والذاكرة والجلسات والمهارات والمهام المجدولة الخاصة به."
  t128: "أسماء ملفات التعريف تصبح أوامر في الصدفة — 'hermes profile create coder' ينشئ الأمر 'coder'."
  t129: "hermes profile export coder -o backup.tar.gz ينشئ أرشيفًا محمولًا لملف التعريف."
  t130: "إذا تشارك ملفّا تعريف رمز بوت بالخطأ، تُحظر البوابة الثانية مع رسالة خطأ واضحة."
  t131: "الجلسات تولّد عناوين وصفية تلقائيًا بعد أول تبادل — مش محتاج تسمّيها بنفسك."
  t132: "عناوين الجلسات تدعم التسلسل: \"my project\" → \"my project #2\" → \"my project #3\"."
  t133: "عند الخروج، يطبع Hermes أمر الاستئناف مع معرّف الجلسة والإحصائيات."
  t134: "hermes sessions export backup.jsonl يصدّر كل الجلسات للنسخ الاحتياطي أو التحليل."
  t135: "hermes -r SESSION_ID يستأنف أي جلسة سابقة محددة بمعرّفها."
  t136: "الذاكرة لقطة مجمّدة — التغييرات تظهر في تعليمات النظام فقط عند بدء الجلسة التالية."
  t137: "مدخلات الذاكرة تُفحص تلقائيًا بحثًا عن أنماط حقن الطلبات وتسريب البيانات."
  t138: "لدى الوكيل مخزنان للذاكرة: ملاحظات شخصية (~2200 حرف) وملف المستخدم (~1375 حرفًا)."
  t139: "التصحيحات التي تعطيها للوكيل (\"لا، اعملها بالطريقة دي\") غالبًا تُحفظ في الذاكرة تلقائيًا."
  t140: "أكثر من 80 مهارة مضمّنة تغطي github والإبداع وmlops والإنتاجية والبحث وغيرها."
  t141: "كل مهارة مثبّتة تصبح أمرًا مائلًا تلقائيًا — اكتب / لتراها كلها."
  t142: "hermes skills install official/security/1password يثبّت مهارات اختيارية من المستودع."
  t143: "يمكن قصر المهارات على أنظمة تشغيل محددة — بعضها لا يُحمَّل إلا على macOS أو Linux."
  t144: "skills.external_dirs في config.yaml يتيح لك تحميل المهارات من مجلدات مخصصة."
  t145: "يمكن للوكيل إنشاء مهاراته الخاصة كذاكرة إجرائية باستخدام skill_manage."
  t146: "/plan يكتب خطة تنفيذ بصيغة markdown في .hermes/plans/ دون تنفيذ أي شيء."
  t147: "المهام المجدولة يمكنها إرفاق مهارات: hermes cron add --skill blogwatcher \"Check for new posts\"."
  t148: "وجهات إرسال المهام المجدولة تشمل telegram وdiscord وslack وemail وsms وأكثر من 12 منصة أخرى."
  t149: "إذا بدأ رد المهمة المجدولة بـ [SILENT]، يُلغى الإرسال — مفيد لمهام المراقبة فقط."
  t150: "Cron يدعم التأخير النسبي (30m) والفواصل (every 2h) وتعبيرات cron وطوابع ISO الزمنية."
  t151: "المهام المجدولة تعمل في جلسات وكيل جديدة تمامًا — لذا يجب أن تكون الطلبات مكتفية بذاتها."
  t152: "وضع الصوت يعمل دون أي مفتاح API إذا كان faster-whisper مثبّتًا (تحويل كلام إلى نص محلي ومجاني)."
  t153: "خمسة مزوّدي TTS متاحون: Edge TTS (مجاني)، وElevenLabs، وOpenAI، وNeuTTS (محلي مجاني)، وMiniMax."
  t154: "/voice on يفعّل وضع الصوت في CLI. وCtrl+B يبدّل التسجيل بالضغط للتحدث."
  t155: "TTS المتدفق يشغّل الجمل فور توليدها — مش هتستنى الرد كله."
  t156: "الرسائل الصوتية على Telegram وDiscord وWhatsApp وSlack تُفرَّغ نصيًا تلقائيًا."
  t157: "Hermes يعمل على 21 منصة مراسلة: Telegram وDiscord وSlack وWhatsApp وSignal وMatrix وIRC وMicrosoft Teams والبريد الإلكتروني وغيرها."
  t158: "hermes gateway install يثبّته كخدمة نظام تبدأ مع الإقلاع."
  t159: "DingTalk يستخدم Stream Mode — لا حاجة إلى Webhooks أو URL عام."
  t160: "BlueBubbles يجلب iMessage إلى Hermes عبر خادم macOS محلي."
  t161: "مسارات Webhook تدعم تحقق HMAC وتحديد معدل الطلبات وتصفية الأحداث."
  t162: "خادم API يوفّر نقطة نهاية متوافقة مع OpenAI تعمل مع Open WebUI وLibreChat."
  t163: "وضع القناة الصوتية في Discord: ينضم البوت إلى VC، ويفرّغ الكلام نصيًا، ويرد بالصوت."
  t164: "group_sessions_per_user: true يعطي كل شخص جلسته الخاصة في المحادثات الجماعية."
  t165: "/sethome يعيّن المحادثة كقناة رئيسية لإرسال المهام المجدولة."
  t166: "البوابة تدعم مهلات قائمة على الخمول — الوكلاء النشطون يمكنهم العمل بلا حد زمني."
  t167: "الموافقة على الأوامر الخطرة لها 4 مستويات: مرة واحدة، لهذه الجلسة، دائمًا (قائمة سماح دائمة)، رفض."
  t168: "وضع الموافقة الذكي يستخدم LLM للموافقة تلقائيًا على الأوامر الآمنة والتنبيه على الخطرة."
  t169: "حماية SSRF تحظر الشبكات الخاصة وعناوين loopback وlink-local وعناوين بيانات السحابة الوصفية."
  t170: "معرّفات الجلسات تبدأ بطابع زمني (20250305_091523_abcd) فيعمل الترتيب بشكل طبيعي في ls وjq."
  t171: "العمليات الفرعية لـ MCP تتلقى بيئة مُصفّاة — لا يمر إلا متغيرات النظام الآمنة."
  t172: "ملفات السياق (.hermes.md، AGENTS.md) تُفحص أمنيًا بحثًا عن حقن الطلبات قبل تحميلها."
  t173: "command_allowlist في config.yaml يوافق بشكل دائم على أنماط محددة من أوامر الصدفة."
  t174: "السياق يُضغط تلقائيًا عند بلوغ الحد — تُحفظ الذكريات ويُلخَّص السجل."
  t175: "شريط الحالة يتحوّل إلى الأصفر ثم البرتقالي ثم الأحمر كلما امتلأ السياق."
  t176: "SOUL.md هو ملف الهوية الأساسي للوكيل — خصّصه لتشكيل سلوكه."
  t177: "Hermes يحمّل سياق المشروع من .hermes.md أو AGENTS.md أو CLAUDE.md أو .cursorrules (أول تطابق)."
  t178: "ملفات AGENTS.md في المجلدات الفرعية تُكتشف تدريجيًا كلما دخل الوكيل إلى المجلدات."
  t179: "ملفات السياق محدودة بـ 20,000 حرف مع اقتطاع ذكي من البداية والنهاية."
  t180: "واجهات المتصفح الخلفية: Chromium المحلي وLightpanda وBrowserbase وBrowser Use وFirecrawl — بالإضافة إلى Camofox كإضافة."
  t181: "Camofox (متصفح Firefox مضاد للكشف) أصبح إضافة: hermes plugins install camofox."
  t182: "browser_exec ينفّذ عدة خطوات متصفح في استدعاء Python واحد — التنقل والاستخراج والنقر معًا."
  t183: "browser.dialog_policy يحدد طريقة التعامل مع نوافذ الحوار الأصلية في الصفحة: must_respond (يرد الوكيل عبر browser_dialog) أو auto_dismiss أو auto_accept."
  t184: "hermes mcp يفتح أداة تفاعلية لاختيار خوادم MCP المعتمدة من Nous لتثبيتها بضغطة زر واحدة."
  t185: "hermes mcp catalog يعرض خوادم MCP المعتمدة من Nous والمضمّنة في المستودع."
  t186: "hermes mcp install <name> يثبّت عنصرًا من الكتالوج، ويطلب بيانات الاعتماد، ويتيح لك اختيار الأدوات التي تفعّلها منه."
  t187: "خوادم MCP تُضبط في config.yaml — مع دعم النقل عبر stdio وHTTP."
  t188: "تصفية الأدوات لكل خادم: tools.include يضيف أدوات محددة لقائمة السماح وtools.exclude يحظرها."
  t189: "خوادم MCP تولّد مجموعات أدوات تلقائيًا أثناء التشغيل — ويمكن لـ hermes tools تفعيلها/تعطيلها لكل منصة."
  t190: "دعم MCP OAuth: auth: oauth يفعّل التفويض عبر المتصفح مع PKCE."
  t191: "نقاط الحفظ بلا أي عبء عند عدم تعديل أي ملفات — ومفعّلة افتراضيًا."
  t192: "تُحفظ لقطة قبل التراجع تلقائيًا، فتقدر تتراجع عن التراجع نفسه."
  t193: "/rollback يتراجع أيضًا عن دور المحادثة، فلا يتذكر الوكيل التغييرات التي تم التراجع عنها."
  t194: "نقاط الحفظ تستخدم مستودعات ظل في ~/.hermes/checkpoints/ — مجلد .git في مشروعك لا يُمَس أبدًا."
  t195: "batch_runner.py يعالج مئات الطلبات بالتوازي لتوليد بيانات التدريب."
  t196: "hermes chat -Q يفعّل الوضع الصامت للاستخدام البرمجي — يُخفي اللافتة ومؤشر الانتظار."
  t197: "حفظ المسارات (--save-trajectories) يلتقط آثار استخدام الأدوات كاملة لتدريب النماذج."
  t198: "ثلاثة أنواع من الإضافات: عامة (أدوات/hooks)، ومزوّدو الذاكرة، ومحركات السياق."
  t199: "hermes plugins install owner/repo يثبّت الإضافات مباشرة من GitHub."
  t200: "مزوّدو الذاكرة الخارجيون: Honcho وHindsight وMem0 وOpenViking وغيرهم عبر hermes plugins install."
  t201: "خطافات الإضافات (hooks) تشمل pre/post_tool_call وpre/post_llm_call وtransform_terminal_output لتوحيد المخرجات."
  t202: "التخزين المؤقت للطلبات (Anthropic) يقلل التكلفة بإعادة استخدام بادئات تعليمات النظام المخزّنة."
  t203: "الوكيل يولّد عناوين الجلسات تلقائيًا في خيط خلفي — دون أي تأثير على سرعة الاستجابة."
  t204: "التوجيه الذكي للنماذج يمكنه توجيه الاستعلامات البسيطة تلقائيًا إلى نموذج أرخص."
  t205: "الأوامر المائلة تدعم المطابقة بالبادئة: /h تؤدي إلى /help، و/mod إلى /model."
  t206: "سحب مسار ملف إلى الطرفية يرفق الصور تلقائيًا أو يرسله كسياق."
  t207: "ملف .worktreeinclude في جذر مستودعك يحدد الملفات المتجاهلة في git التي تُنسخ إلى أشجار العمل."
  t208: "hermes acp يشغّل Hermes كخادم ACP للتكامل مع VS Code وZed وJetBrains."
  t209: "المزوّدون المخصصون: احفظ نقاط نهاية مسمّاة في config.yaml تحت custom_providers."
  t210: "HERMES_EPHEMERAL_SYSTEM_PROMPT يُدرج تعليمات نظام لا تُحفظ أبدًا في السجل."
  t211: "credential_pool_strategies يدعم التناوب بأساليب fill_first وround_robin وleast_used وrandom."
  t212: "hermes auth add nous أو hermes auth add openai-codex يضبط المزوّدين القائمين على OAuth."
  t213: "خادم API يدعم Chat Completions وResponses API مع حفظ الحالة على الخادم."
  t214: "tool_preview_length: 0 في الإعدادات يعرض مسارات الملفات كاملة في سجل نشاط مؤشر الانتظار."
  t215: "hermes status --deep ينفّذ فحوصات تشخيصية أعمق على كل المكوّنات."
  t216: "المهام المجدولة يمكنها إرفاق سكربت Python (--script) تُدرج مخرجاته (stdout) في الطلب كسياق."
  t217: "سكربتات cron موجودة في ~/.hermes/scripts/ وتعمل قبل الوكيل — مثالية لخطوط جمع البيانات."
  t218: "prefill_messages_file في config.yaml يُدرج أمثلة few-shot في كل استدعاء API، ولا تُحفظ أبدًا في السجل."
  t219: "SOUL.md يستبدل الهوية الافتراضية للوكيل بالكامل — أعد كتابته ليصبح Hermes على مقاسك."
  t220: "SOUL.md يُملأ تلقائيًا بشخصية افتراضية في أول تشغيل. عدّله لتخصيصه."
  t221: "/compress <focus topic> يخصص 60-70% من ميزانية الملخص لموضوعك ويختصر الباقي بقوة."
  t222: "من الضغط الثاني فصاعدًا، يحدّث الضاغط الملخص السابق بدلًا من البدء من الصفر."
  t223: "قبل إعادة ضبط جلسة البوابة، يحفظ Hermes الحقائق المهمة في الذاكرة تلقائيًا في الخلفية."
  t224: "network.force_ipv4: true في config.yaml يحل مشاكل التعليق على الخوادم ذات IPv6 المعطّل — يعدّل socket وقت التشغيل."
  t225: "أداة الطرفية توضّح رموز الخروج الشائعة: grep يُرجع 1 = 'No matches found (not an error)'."
  t226: "أوامر الطرفية الأمامية الفاشلة يُعاد تنفيذها تلقائيًا حتى 3 مرات مع تأخير متزايد (2s، 4s، 8s)."
  t227: "أوامر sudo المجردة يُعاد كتابتها تلقائيًا لتمرير SUDO_PASSWORD من .env — دون الحاجة لطلب تفاعلي."
  t228: "مساعدات execute_code تتطلب استيرادًا صريحًا: from hermes_tools import json_parse, shell_quote, retry."
  t229: "أدوات البيئة المعزولة السبع في execute_code (web_search، terminal، read/write/search/patch) تستخدم RPC — ولا تدخل السياق أبدًا."
  t230: "قراءة نفس الجزء من الملف 3 مرات أو أكثر تُطلق تحذيرًا. وعند 4 مرات أو أكثر تُحظر نهائيًا لمنع الحلقات."
  t231: "write_file وpatch يكتشفان إذا عُدّل الملف من خارج الوكيل منذ آخر قراءة وينبّهان إلى أنه قديم."
  t232: "صيغة V4A للتعديل تدعم توجيهات Add File وDelete File وMove File — وليس Update فقط."
  t233: "خوادم MCP يمكنها طلب إكمالات LLM عكسيًا عبر sampling — فيصبح الوكيل أداة للخادم."
  t234: "خوادم MCP ترسل notifications/tools/list_changed لإطلاق إعادة تسجيل الأدوات تلقائيًا دون إعادة التشغيل."
  t235: "delegate_task مع acp_command: 'claude' يطلق Claude Code كوكيل فرعي من أي منصة."
  t236: "للتفويض خيط نبض (heartbeat) — نشاط الوكيل الفرعي ينتقل إلى الأصل، فيمنع انتهاء مهلة البوابة."
  t237: "عندما يُرجع المزوّد HTTP 402 (الدفع مطلوب)، ينتقل العميل المساعد تلقائيًا إلى المزوّد التالي."
  t238: "agent.tool_use_enforcement يوجّه النماذج التي تصف الإجراءات بدلًا من استدعاء الأدوات — تلقائي لـ GPT/Codex."
  t239: "agent.restart_after_turn_timeout يتيح للأدوار الجارية أن تنتهي قبل أن يدخل /restart مرحلة stop()؛ أما restart_drain_timeout فهو فقط ميزانية المقاطعة القسرية بعد بدء stop()."
  t240: "agent.api_max_retries (الافتراضي 3) يحدد عدد مرات إعادة الوكيل لاستدعاء API فاشل قبل إظهار الخطأ — خفّضه للانتقال السريع إلى البديل."
  t241: "البوابة تخزّن نسخ AIAgent مؤقتًا لكل جلسة — تدمير هذا التخزين يُفسد التخزين المؤقت للطلبات في Anthropic."
  t242: "أي موقع يمكنه عرض مهارات عبر /.well-known/skills/index.json — ويكتشفها مركز المهارات تلقائيًا."
  t243: "سجل تدقيق المهارات في ~/.hermes/skills/.hub/audit.log يتتبّع كل عملية تثبيت وإزالة."
  t244: "أشجار عمل git القديمة تُنظَّف تلقائيًا: الأشجار المدمجة النظيفة تُحذف؛ والأشجار الخاملة ذات التغييرات أو غير المدفوعة تُؤرشف أولًا ويمكن استعادتها بـ hermes worktree restore."
  t245: "ملفات التعريف تحدد نطاق حالة Hermes عبر HERMES_HOME؛ والعمليات الفرعية لأدوات المضيف تحتفظ بـ HOME الحقيقي لديك ما لم يكن terminal.home_mode هو profile."
  t246: "متغير البيئة HERMES_HOME_MODE (ثماني، مثل 0701) يضبط صلاحيات مخصصة للمجلد للسماح بوصول خادم الويب."
  t247: "وضع الحاوية: ضع .container-mode في HERMES_HOME وسيدخل CLI المضيف إلى الحاوية تلقائيًا."
  t248: "Ctrl+C له 5 مستويات أولوية: إلغاء التسجيل ← إلغاء الطلبات ← إلغاء أداة الاختيار ← مقاطعة الوكيل ← الخروج."
  t249: "كل مقاطعة أثناء تشغيل الوكيل تُسجَّل في ~/.hermes/interrupt_debug.log مع طوابع زمنية."
  t250: "BROWSER_CDP_URL يربط أدوات المتصفح بأي متصفح عامل من عائلة Chromium — يقبل WebSocket أو HTTP أو host:port."
  t251: "BROWSERBASE_ADVANCED_STEALTH=true يفعّل حماية متقدمة ضد الكشف مع Chromium مخصص (Scale Plan)."
  t252: "CLI ينتقل تلقائيًا إلى الوضع المضغوط في الطرفيات الأضيق من 80 عمودًا."
  t253: "الأوامر السريعة تدعم نوعين: exec (تشغيل أمر صدفة مباشرة) وalias (إعادة التوجيه إلى أمر آخر)."
  t254: "نموذج التفويض لكل مهمة: delegation.model وdelegation.provider في الإعدادات يوجّهان الوكلاء الفرعيين إلى نماذج أرخص."
  t255: "delegation.reasoning_effort يتحكم بشكل مستقل في عمق تفكير الوكلاء الفرعيين."
  t256: "display.platforms في config.yaml يتيح تجاوز إعدادات العرض لكل منصة: {telegram: {tool_progress: all}}."
  t257: "human_delay.mode في الإعدادات يحاكي سرعة الكتابة البشرية — مع نطاق min_ms/max_ms قابل للضبط."
  t258: "ترحيلات إصدار الإعدادات تعمل تلقائيًا عند التحميل — مفاتيح الإعداد الجديدة تظهر دون تدخل يدوي."
  t259: "نماذج GPT وCodex تحصل على إرشادات خاصة في تعليمات النظام لانضباط استخدام الأدوات والاستخدام الإلزامي لها."
  t260: "نماذج Gemini تحصل على توجيهات مخصصة للمسارات المطلقة واستدعاءات الأدوات المتوازية والأوامر غير التفاعلية."
  t261: "يمكن ضبط context.engine في config.yaml على اسم إضافة لاستخدام استراتيجيات بديلة لإدارة السياق."
  t262: "مع متصفح سحابي، تُفتح روابط localhost والشبكة المحلية في Chromium محلي بدلًا منه (browser.auto_local_for_private_urls، مفعّل افتراضيًا)."
  t263: "الضاغط يجري مرورًا تمهيديًا رخيصًا: مخرجات الأدوات التي تتجاوز 200 حرف تُستبدل بعناصر نائبة قبل تشغيل LLM."
  t264: "عند فشل الضغط، تتوقف المحاولات التالية لمدة 10 دقائق لتجنّب إغراق API بالطلبات."
  t265: "الأوامر الخطرة الطويلة (أكثر من 70 حرفًا) تحصل على خيار 'view' في طلب الموافقة لرؤية النص كاملًا أولًا."
  t266: "عرض مستوى الصوت يُظهر أشرطة ▁▂▃▄▅▆▇ أثناء التسجيل الصوتي بناءً على مستويات RMS للميكروفون."
  t267: "أسماء ملفات التعريف لا يمكن أن تتعارض مع ملفات تنفيذية موجودة في PATH — 'hermes profile create ls' سيُرفض."
  t268: "hermes profile create backup --clone-all ينسخ كل شيء (الإعدادات، المفاتيح، SOUL.md، الذكريات، المهارات، الجلسات)."
  t269: "مفتاح التسجيل الصوتي قابل للضبط عبر voice.record_key في config.yaml — وليس Ctrl+B فقط."
  t270: "ملفات .cursorrules و.cursor/rules/*.mdc تُكتشف تلقائيًا وتُحمَّل كسياق للمشروع."
  t271: "ملفات السياق تُفحص بحثًا عن أكثر من 10 أنماط لحقن الطلبات — Unicode غير مرئي، و'ignore instructions'، ومحاولات تسريب البيانات."
  t272: "GPT-5 وCodex يستخدمان الدور 'developer' بدلًا من 'system' في صيغة الرسائل."
  t273: "تجاوزات مساعدة لكل مهمة: auxiliary.vision.provider وauxiliary.compression.model وغيرها في config.yaml."
  t274: "العميل المساعد يعامل 'main' كاسم بديل للمزوّد — يُترجم إلى مزوّدك ونموذجك الأساسيين الفعليين."
  t275: "hermes import-agent openclaw --dry-run يعاين الترحيل من OpenClaw دون كتابة أي شيء."
  t276: "مسارات الملفات الملصوقة بعلامات تنصيص أو مسافات مهرّبة تُعالج تلقائيًا — دون تنظيف يدوي."
  t277: "الأوامر المائلة لا تُطلق أبدًا طيّ اللصق الكبير — /command مع وسيطات كبيرة يعمل بشكل صحيح."
  t278: "في وضع المقاطعة، الأوامر المائلة المكتوبة أثناء تنفيذ الوكيل تتجاوز منطق المقاطعة وتعمل فورًا."
  t279: "HERMES_DEV=1 يتجاوز اكتشاف وضع الحاوية للتطوير المحلي."
  t280: "كل خادم MCP يحصل على مجموعة أدوات خاصة به (mcp-servername) يمكن تفعيلها/تعطيلها بشكل مستقل عبر hermes tools."
  t281: "العناصر النائبة ${ENV_VAR} لـ MCP في الإعدادات تُحل عند تشغيل الخادم — بما في ذلك المتغيرات من ~/.hermes/.env."
  t282: "المهارات من المستودعات الموثوقة (NousResearch) تحصل على مستوى أمان 'trusted'؛ ومهارات المجتمع تخضع لفحص إضافي."
  t283: "حجر المهارات الصحي في ~/.hermes/skills/.hub/quarantine/ يحتجز المهارات بانتظار المراجعة الأمنية."
  t284: "/steer <prompt> يُدرج ملاحظة بعد استدعاء الأداة التالي — وجّه المسار في منتصف المهمة دون مقاطعة."
  t285: "/goal <text> يضبط هدفًا دائمًا بأسلوب Ralph-loop — يواصل Hermes دورًا بعد دور تلقائيًا حتى يقرر الحَكَم أنه انتهى."
  t286: "/snapshot create [label] يحفظ لقطة كاملة لحالة إعدادات Hermes؛ و/snapshot restore <id> يعيدها لاحقًا."
  t287: "/copy [N] ينسخ آخر رد للمساعد إلى الحافظة، أو الرد رقم N من الأخير عند إضافة رقم."
  t288: "/redraw يفرض إعادة رسم الواجهة بالكامل، فيصلح انحراف الطرفية بعد تغيير حجم tmux أو آثار تحديد الماوس."
  t289: "/agents (الاسم البديل /tasks) يعرض الوكلاء النشطين والمهام الخلفية الجارية في الجلسة الحالية."
  t290: "/footer يُظهر/يُخفي تذييل البوابة في الردود النهائية الذي يعرض النموذج ونسبة السياق وcwd."
  t291: "/busy queue|steer|interrupt يتحكم في ما يفعله الضغط على Enter أثناء عمل Hermes."
  t292: "/topic في رسائل Telegram الخاصة يفعّل وضع الموضوعات متعدد الجلسات الذي يديره المستخدم — و/topic <id> يستعيد الجلسات السابقة مباشرة."
  t293: "/approve session|always يشغّل أمرًا خطرًا معلّقًا بنطاق الثقة الذي تختاره؛ و/deny يرفضه."
  t294: "/restart يعيد تشغيل البوابة بسلاسة بعد إنهاء التشغيلات النشطة، ثم ينبّه صاحب الطلب عند عودتها."
  t295: "/kanban boards switch <slug> يغيّر لوحة Kanban النشطة متعددة المشاريع من داخل المحادثة."
  t296: "/reload يعيد تحميل ~/.hermes/.env في الجلسة الجارية — لالتقاط مفاتيح API الجديدة دون إعادة التشغيل."
  t297: "cronjob مع no_agent=True يشغّل سكربتًا حسب الجدول ويرسل مخرجاته مباشرة — صفر توكنات، بدون LLM."
  t298: "مخرجات سكربت cron الفارغة تعني دورة صامتة — لا يُرسل شيء، مثالي لمراقبة الحدود."
  t299: "HERMES_CRON_MAX_PARALLEL (الافتراضي 4) يحدد عدد المهام المجدولة التي تعمل في كل دورة حتى لا تُستنزف مفاتيحك بالدفعات."
  t300: "خطافات البوابة موجودة تحت ~/.hermes/hooks/<name>/ مع HOOK.yaml + handler.py — ويجب أن يكون اسم المعالج `handle`."
  t301: "أحداث الخطافات تشمل gateway:startup وsession:start وagent:step والاشتراكات الشاملة command:*."
  t302: "ضع قائمة مراجعة في ~/.hermes/BOOT.md وسيشغّلها خطاف gateway:startup كوكيل لمرة واحدة عند كل إقلاع."
  t303: "hermes curator run --dry-run يعاين ما سيؤرشفه أو يدمجه المنظّم دون تغيير أي شيء."
  t304: "hermes curator pin <skill> يحمي المهارة تمامًا من الأرشفة التلقائية ومن أداة skill_manage الخاصة بالوكيل."
  t305: "hermes curator rollback يستعيد المهارات من لقطة ما قبل التشغيل — النسخ الاحتياطية موجودة تحت skills/.curator_backups/."
  t306: "hermes auth reset <provider> [target] يمسح فترات التهدئة وعلامات الاستنفاد على مجموعة بيانات اعتماد كاملة، أو على بيان اعتماد واحد بالفهرس أو المعرّف أو التسمية."
  t307: "credential_pool_strategies.<provider>: round_robin يدوّر المفاتيح بالتساوي بدلًا من الافتراضي fill_first."
  t308: "use_gateway: true لكل أداة يوجّه الويب أو الصور أو tts أو المتصفح عبر اشتراكك في Nous — دون مفاتيح إضافية."
  t309: "provider_routing.data_collection: deny يستبعد المزوّدين الذين يخزّنون البيانات على OpenRouter."
  t310: "provider_routing.require_parameters: true يوجّه فقط إلى المزوّدين الذين يدعمون كل معامل في طلبك."
  t311: "HERMES_TUI_RESUME=1 يعيد الاتصال تلقائيًا بأحدث جلسة TUI عند التشغيل — مفيد بعد انقطاع SSH."
  t312: "HERMES_TUI_THEME=light|dark|<hex> يفرض سمة TUI على الطرفيات التي لا تضبط COLORFGBG."
  t313: "Ctrl+G أو Ctrl+X Ctrl+E في TUI يفتح مخزن الإدخال في $EDITOR للطلبات الطويلة متعددة الأسطر."
  t314: "TUI يعرض LaTeX داخل النص — $E=mc^2$ تصبح رموز رياضيات Unicode بدلًا من TeX الخام."
  t315: "hermes dashboard يشغّل واجهة ويب محلية على 127.0.0.1:9119 — لا تغادر أي بيانات localhost."
  t316: "hermes dashboard يضمّن واجهة Hermes TUI كاملة في متصفحك عبر xterm.js وWebSocket PTY."
  t317: "ضع ملف YAML في ~/.hermes/dashboard-themes/ بلونين للوحة الألوان لتغيير مظهر لوحة التحكم بالكامل."
  t318: "إضافات لوحة التحكم جاهزة للإسقاط: manifest.json + حزمة JS في ~/.hermes/dashboard-plugins/ — دون الحاجة إلى npm build."
  t319: "layoutVariant: cockpit في سمة لوحة التحكم يضيف شريطًا أيسر بعرض 260px يمكن للإضافات ملؤه عبر خانة الشريط الجانبي."
  t320: "display.tool_progress_command: true يتيح /verbose على منصات المراسلة؛ وهو مقتصر على CLI افتراضيًا."
  t321: "HERMES_BACKGROUND_NOTIFICATIONS=result ينبّه فقط عند انتهاء المهام الخلفية (مقابل concise/all/error/off)."
  t322: "HERMES_WRITE_SAFE_ROOT يقصر write_file/patch على بادئات مجلدات محددة؛ ويمكن تحديد عدة مسارات عبر os.pathsep (: أو ;)."
  t323: "HERMES_IGNORE_RULES يتخطى الإدراج التلقائي لـ AGENTS.md وSOUL.md و.cursorrules والذاكرة والمهارات المحمّلة مسبقًا."
  t324: "HERMES_ACCEPT_HOOKS يوافق تلقائيًا على خطافات الصدفة غير المعروفة المعرّفة في config.yaml دون طلب TTY."
  t325: "auxiliary.goal_judge.model يوجّه حَكَم /goal إلى نموذج سريع ورخيص لإبقاء تكلفة الحلقة قريبة من الصفر."
  t326: "نقاط الحفظ تتخطى المجلدات التي تحتوي على أكثر من 50,000 ملف لتجنّب عمليات git البطيئة في المستودعات الضخمة."
  t327: "tts.provider: piper يشغّل TTS محليًا بـ 44 لغة على المعالج — الأصوات تُنزَّل تلقائيًا إلى ~/.hermes/cache/piper-voices/."
  t328: "tts.providers.<name>.type: command يربط أي محرك TTS عبر CLI باستخدام العنصرين النائبين {input_path} و{output_path}."
  t329: "API_SERVER_ENABLED=true يشغّل نقطة نهاية متوافقة مع OpenAI بجانب البوابة لـ Open WebUI وLibreChat."
  t330: "GATEWAY_PROXY_URL يشغّل إعدادًا مقسّمًا: إدخال/إخراج المنصة محليًا، وعمل الوكيل مفوّض إلى خادم API بعيد."
  t331: "MATRIX_DEVICE_ID يثبّت معرّف جهاز ثابتًا لـ E2EE — بدونه تتغير المفاتيح مع كل تشغيل ويتعطل فك تشفير الرسائل القديمة."
  t332: "TELEGRAM_WEBHOOK_SECRET مطلوب كلما ضُبط TELEGRAM_WEBHOOK_URL — ولّده باستخدام openssl rand -hex 32."
  t333: "batch_runner.py --resume يطابق الطلبات المكتملة حسب نصها، فلا تُعاد الأعمال المنتهية عند إعادة ترتيب البيانات."
  t334: "/new يبدأ جلسة جديدة في مكانها (الاسم البديل /reset) — معرّف جلسة جديد وسجل نظيف، ويبقى CLI مفتوحًا."
  t335: "/clear يمسح شاشة الطرفية ويبدأ جلسة جديدة — اختصار واحد لبداية نظيفة."
  t336: "/history يطبع المحادثة الحالية داخل الواجهة دون مغادرة CLI — مفيد لمراجعة سريعة."
  t337: "/save يكتب المحادثة الحالية على القرص دون إنهاء الجلسة."
  t338: "/status يعرض معلومات الجلسة في لمحة: المعرّف والعنوان والنموذج واستخدام التوكنات والوقت المنقضي."
  t339: "/image <path> يرفق ملف صورة محليًا لطلبك التالي دون لصق أو سحب وإفلات."
  t340: "/platforms يعرض حالة اتصال البوابة ومنصات المراسلة من داخل المحادثة."
  t341: "/commands يعرض القائمة الكاملة للأوامر المائلة والمهارات المثبّتة على صفحات — مفيد على المنصات التي لا تدعم الإكمال بـ Tab."
  t342: "/toolsets يعرض كل مجموعات الأدوات المتاحة لتعرف ما يقبله -t/--toolsets."
  t343: "/voice tts يبدّل وضع TTS فقط — يرد الوكيل بصوت مسموع بينما تكتب أنت طلباتك."
  t344: "/reload-skills يعيد فحص ~/.hermes/skills/ لتظهر المهارات المُضافة دون إعادة تشغيل الجلسة."
  t345: "/indicator kaomoji|emoji|unicode|ascii يختار نمط مؤشر الانشغال في TUI أثناء تشغيل الوكيل."
  t346: "/debug يرفع حزمة دعم (معلومات النظام + السجلات) ويُرجع روابط قابلة للمشاركة — ويعمل في المحادثة أيضًا."
  t347: "hermes -z \"<prompt>\" هو أنقى استعلام لمرة واحدة: الإجابة النهائية على stdout ولا شيء غيرها — مثالي للتمرير في السكربتات."
  t348: "hermes chat --pass-session-id يُدرج معرّف الجلسة في تعليمات النظام ليتمكن الوكيل من الإشارة إليه."
  t349: "hermes chat --image path/to/pic.png يرفق صورة محلية باستعلام -q واحد دون خطوة رفع منفصلة."
  t350: "hermes chat --ignore-user-config يتخطى إعدادات المستخدم النشطة — لتقارير أخطاء وتشغيلات CI قابلة للتكرار."
  t351: "hermes chat --source tool يوسم المحادثات البرمجية حتى لا تزدحم بها hermes sessions list."
  t352: "hermes dump --show-keys يتضمن بصمات مفاتيح API مُخفاة لتصحيح أعمق مع الدعم."
  t353: "hermes sessions rename <ID> \"new title\" يعيد تسمية أي جلسة سابقة؛ وhermes sessions delete <ID> يحذف واحدة."
  t354: "hermes import يستعيد نسخة Hermes احتياطية كاملة بصيغة zip؛ وصادرات الجلسات بصيغة JSON/JSONL تُستورد من صفحة Sessions في لوحة التحكم."
  t355: "hermes fallback يدير سلسلة fallback_model بشكل تفاعلي — دون تعديل config.yaml يدويًا."
  t356: "hermes pairing يغيّر رمز الإقران للرسائل الخاصة — أول من يراسل بعد التغيير يحصل على صلاحية الوصول إلى البوت."
  t357: "hermes setup يرشد المستخدمين الجدد خلال ضبط المزوّد والمفاتيح وربط المنصات في مسار تفاعلي واحد."
  t358: "hermes status --deep ينفّذ فحص السلامة الكامل لكل مكوّن؛ أما hermes status العادي فهو العرض السريع."
  t359: "HERMES_AGENT_TIMEOUT=0 يعطّل إيقاف البوابة للوكيل العامل بسبب الخمول — استخدمه لجلسات البحث الطويلة."
  t360: "HERMES_ENABLE_PROJECT_PLUGINS=1 يحمّل تلقائيًا إضافات المستودع المحلية من ./.hermes/plugins/ — ومقيّد بالثقة بحكم التصميم."
  t361: "HERMES_DISABLE_FILE_STATE_GUARD=1 يعطّل حماية 'تغيّر الملف منذ قراءته' في patch وwrite_file."
  t362: "HERMES_ALLOW_PRIVATE_URLS=true يسمح لأدوات الويب بالوصول إلى localhost والشبكات الخاصة — معطّل افتراضيًا في وضع البوابة."
  t363: "HERMES_OPTIONAL_SKILLS=name1,name2 يثبّت تلقائيًا مهارات إضافية من الكتالوج الاختياري في أول تشغيل لكل ملف تعريف."
  t364: "HERMES_BUNDLED_SKILLS يشير إلى شجرة مهارات مضمّنة مخصصة — يستخدمه تغليف Homebrew وNix."
  t365: "HERMES_DUMP_REQUEST_STDOUT=1 يطبع حمولة كل طلب API على stdout بدلًا من ملفات السجل."
  t366: "HERMES_OAUTH_TRACE=1 يسجّل محاولات تبادل وتحديث رموز OAuth (مع إخفاء البيانات) لتصحيح مصادقة المزوّد."
  t367: "HERMES_STREAM_RETRIES (الافتراضي 3) يتحكم في محاولات إعادة الاتصال أثناء البث عند أخطاء الشبكة المؤقتة."
  t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false يوقف رسائل التأكيد ⚡/⏳/⏩ عندما يراسل المستخدم وكيلًا مشغولًا."
  t369: "HERMES_AGENT_NOTIFY_INTERVAL (الافتراضي 180s) يحدد عدد مرات تنبيه البوابة بالتقدم في الأدوار الطويلة."
  t370: "HERMES_RESTART_DRAIN_TIMEOUT (الافتراضي 900s) يحدد أقصى مدة ينتظرها /restart للتشغيلات الجارية قبل الفرض."
  t371: "HERMES_CHECKPOINT_TIMEOUT (الافتراضي 30s) يحدد أقصى مدة لإنشاء نقطة حفظ لنظام الملفات — ارفعه في المستودعات الضخمة."
  t372: "image_gen.model في config.yaml يختار نموذج FAL: flux-2/klein وgpt-image-2 وnano-banana-pro وغيرها."
  t373: "image_gen.provider يوجّه توليد الصور عبر إضافة (OpenAI Images، Codex، FAL) بدلًا من الافتراضي."
  t374: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY يوجّهان تحليل الرؤية إلى أي نقطة نهاية متوافقة مع OpenAI."
  t375: "API_SERVER_MODEL_NAME يخصّص اسم النموذج في /v1/models — ضروري لإعدادات Open WebUI متعددة ملفات التعريف."
  t376: "إضافات لوحة التحكم تُقدَّم من /dashboard-plugins/<name>/ — ضع الملفات في ~/.hermes/dashboard-plugins/."
  t377: "محادثات --source tool مستبعدة من hermes sessions list افتراضيًا — حدّد --source صراحةً لرؤيتها."
  # Empty-composer example prompts (TUI). Generic on purpose: Hermes is not coding-only.
  placeholder:
    p01: "اسأل عن أي شيء، أو اكتب / لعرض الأوامر…"
    p02: "لخّص محتويات هذا المجلد"
    p03: "اكتب مسودة رد على آخر بريد في صندوقي"
    p04: "خطّط لميزة، ثم نفّذها خطوة بخطوة"
    p05: "اعثر على اختبار فاشل وأصلحه"
    p06: "ابحث في هذا الموضوع واكتب لي ملخصًا"
    p07: "ما الذي تغيّر في هذا المستودع مؤخرًا؟"
    p08: "حوّل هذه الملاحظات إلى قائمة مهام"
    p09: "اشرح هذا الخطأ وطريقة إصلاحه"
    p10: "اضبط تذكيرًا أو جدول مهمة متكررة"
    p11: "اكتب / لتصفح الأوامر، أو Ctrl+P للوحة الأوامر"

